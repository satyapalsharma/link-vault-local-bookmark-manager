# Number of days of inactivity before an issue becomes stale
daysUntilStale: 60
# Number of days to wait before closing an issue
daysUntilClose: 7
# Issues with these labels will never be marked as stale
exemptLabels:
  - pinned
  - security
# Label to use when marking an issue as stale
staleLabel: stale
# Comment to post when marking an issue as stale
markComment: >
  This issue has been automatically marked as stale because it has not had
  recent activity. It will be closed in 7 days if no further activity occurs.
  Thank you for your contributions.
# Comment to post when closing a stale issue
closeComment: >
  This issue was automatically closed because it has been stale for 7 days.
  Feel free to reopen it if you think it is still relevant.
# Limit to only open issues or open pull requests
only: issues
